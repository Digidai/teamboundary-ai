name: Bug report
description: Report a reproducible non-security defect using synthetic data.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: Do not include vulnerabilities, credentials, prompts, tenant data or private account details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use only synthetic data and include the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no security vulnerability, secret, tenant data or confidential information.
          required: true
